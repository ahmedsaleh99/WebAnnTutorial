name: webann-tutorial

services:
  api:
    build:
      context: ./backend
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DJANGO_DATABASE_PATH: /tmp/db.sqlite3
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: insecure-compose-development-key
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/').read()"
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s
    networks:
      - application

  frontend:
    build:
      context: ./frontend
    environment:
      API_URL: http://api:8000/health/
      PORT: "5173"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173/health/').then(response => { if (!response.ok) process.exit(1) })"
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s
    networks:
      - application

networks:
  application:
